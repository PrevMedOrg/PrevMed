# ProbaLYNCH Clinical Questionnaire Configuration
# This YAML file defines the structure and flow of the ProbaLYNCH survey for Lynch syndrome risk assessment

page_title: "### ProbaLYNCH — Évaluez votre risque de syndrome de Lynch | Prévention Familiale"
survey_name: ProbaLYNCH
survey_version: 1.0.0
show_survey_version: true
show_webapp_version: false
legal_summary: "Mentions légales et contact"
PrevMed_version: 1.1.0

# Optional: display survey_name as a title at the top of the page (default: true)
show_survey_title: false

# Optional: markdown content for the greetings landing page.
# When set, a greetings page is shown first on route / with this content
# and the legal terms at the bottom. The user clicks "Start" to reach the survey.
# Optional: route path for the survey page when greetings_md is set.
# The greetings page is served at /, and the survey at this route.
# Default: /survey
# survey_route: lynch
#
# greetings_md: |
#   <h1 style="text-align: center;">Prévention Médicale</h1>
#
#   Recommandations issues de l’expérience acquise en CHU, en médecine adulte, en consultation de génétique-oncogénétique-prévention
#
#   ### [Vous avez eu un cancer colorectal dans votre famille ?](https://preventionfamiliale.fr/lynch)
#
#    <img src="https://preventionfamiliale.fr/Logo.svg" style="float: right; height: 3em;" alt="Logo ASAGE">

# Optional header text - rendered as markdown at top of survey page
header: /app/examples/ProbaLynch/header.md
questions_header: "## Evaluez votre probabilité de porter sans le savoir la fragilité dite du [syndrome de Lynch](https://syndrome-de-lynch.fr)"

questions:
  - variable: sex
    order: 1
    widget: Radio
    widget_args:
      choices: ["M", "F"]
    question: Votre sexe ?

  - variable: current_age
    order: 2
    widget: Number
    widget_args:
      precision: 0
    question: Votre âge actuel (en années) ?
    valid_if: current_age >= 10 and current_age <= 120
    invalid_message: L'âge doit être compris entre 10 et 120 ans.

  - variable: personal_crc_count
    order: 3
    widget: Number
    widget_args:
      precision: 0
    question: Vous avez eu combien de cancers colorectaux ?
    valid_if: personal_crc_count >= 0
    invalid_message: Le nombre de cancers ne peut pas être négatif.

  - variable: age_crc_proband
    order: 4
    widget: Number
    widget_args:
      precision: 0
    question: Votre âge à votre premier cancer colorectal ?
    valid_if: 0 <= age_crc_proband <= current_age
    skip_if: personal_crc_count == 0

  - variable: personal_ec
    order: 5
    widget: Radio
    widget_args:
      choices: ["Non", "Oui"]
      value: Non
    question: "Avez-vous été atteinte d'un cancer du « corps » de l'utérus (adénocarcinome de l'« endomètre », cancer du col de l'utérus exclu) ?"
    skip_if: sex == 'M'

  - variable: age_ec_proband
    order: 6
    widget: Number
    widget_args:
      precision: 0
    skip_if: personal_ec == 'Non'
    valid_if: 0 <= age_ec_proband <= current_age
    question: Votre âge au diagnostic de cancer du corps de l'utérus (endomètre) ?

  - variable: personal_other_ls
    order: 7
    widget: Radio
    widget_args:
      choices: ["Non", "Oui"]
      value: Non
    question: "Etes-vous une personne qui a été atteinte d'au moins un cancer de l'un de ces organes : l'ovaire, l'estomac, l'intestin grêle, la vésicule biliaire ou les voies biliaires, le pancréas, les voies urinaires (rein-uretère-vessie), la peau («carcinome sébacé » ou « kérato-acanthome ») ou le cerveau ?"

  - variable: fdr_crc_count
    order: 8
    widget: Number
    widget_args:
      precision: 0
      value: 0
    question: Combien de personnes ont été atteintes de cancer colorectal parmi vos frères et sœurs, vos enfants, votre père ou votre mère ?
    valid_if: fdr_crc_count >= 0
    invalid_message: Le nombre de cancers ne peut pas être négatif.

  - variable: age_crc_fdr
    order: 9
    widget: Number
    widget_args:
      precision: 0
    skip_if: fdr_crc_count == 0
    question: Age au plus précoce cancer colorectal, parmi ceux diagnostiqués chez vos frères et sœurs, vos enfants, votre père et votre mère ?
    valid_if: age_crc_fdr >= 0
    invalid_message: L'âge ne peut pas être négatif.

  - variable: fdr_ec_count
    order: 10
    widget: Number
    widget_args:
      precision: 0
      value: 0
    question: "Nombre de cancers de l'utérus (prendre « utérus » en l'absence de précision sur la partie de l'utérus atteinte, mais si la précision est connue, ne garder que le cancer du « corps » de l'utérus = adénocarcinome de l'« endomètre », excluant le cancer du col de l'utérus) chez vos soeurs, vos filles et votre mère ?"
    valid_if: fdr_ec_count >= 0
    invalid_message: Le nombre de cancers ne peut pas être négatif.

  - variable: age_ec_fdr
    order: 11
    widget: Number
    widget_args:
      precision: 0
    skip_if: fdr_ec_count == 0
    question: Age au plus précoce cancer de l’utérus, parmi ceux diagnostiqués chez vos sœurs, vos filles et votre mère ?
    valid_if: age_ec_fdr >= 0
    invalid_message: L'âge ne peut pas être négatif.

  - variable: fdr_other_ls_count
    order: 12
    widget: Number
    widget_args:
      precision: 0
      value: 0
    question: "Nombre d'autres cancers du syndrome de Lynch (l'ovaire, l'estomac, l'intestin grêle, la vésicule biliaire ou les voies biliaires, le pancréas, les voies urinaires (rein-uretère-vessie), la peau («carcinome sébacé » ou « kérato-acanthome ») ou le cerveau) parmi vos frères et sœurs, vos enfants, votre père et votre mère ?"
    valid_if: fdr_other_ls_count >= 0
    invalid_message: Le nombre de cancers ne peut pas être négatif.

  - variable: sdr_crc_count
    order: 13
    widget: Number
    widget_args:
      precision: 0
      value: 0
    question: Nombre de cancer colorectaux chez vos grands-parents, oncles et tantes, neveux et nièces, petits-enfants, demi-frères et demi-sœurs ?
    valid_if: sdr_crc_count >= 0
    invalid_message: Le nombre de cancers ne peut pas être négatif.

  - variable: age_crc_sdr
    order: 14
    widget: Number
    widget_args:
      precision: 0
    question: Age au plus précoce cancer colorectal, parmi ceux diagnostiqués chez vos grands-parents, oncles et tantes, neveux et nièces, petits-enfants, demi-frères et demi-sœurs ?
    skip_if: sdr_crc_count == 0
    valid_if: age_crc_sdr >= 0
    invalid_message: L'âge ne peut pas être négatif.

  - variable: sdr_ec_count
    order: 15
    widget: Number
    widget_args:
      precision: 0
      value: 0
    question: "Nombre de cancers de l'utérus (prendre « utérus » en l'absence de précision sur la partie de l'utérus atteinte, mais si la précision est connue, ne garder que le cancer du « corps » de l'utérus = adénocarcinome de l'« endomètre », excluant le cancer du col de l'utérus) chez vos grands-mères, tantes, nièces et petites-filles ?"
    valid_if: sdr_ec_count >= 0
    invalid_message: Le nombre de cancers ne peut pas être négatif.

  - variable: age_ec_sdr
    order: 16
    widget: Number
    widget_args:
      precision: 0
    question: Age au plus précoce cancer de l’utérus parmi ceux diagnostiqués chez vos grands-mères, tantes, nièces, petites-filles et demi-sœurs ?
    skip_if: sdr_ec_count == 0
    valid_if: age_ec_sdr >= 0
    invalid_message: L'âge ne peut pas être négatif.

  - variable: sdr_other_ls_count
    order: 17
    widget: Number
    widget_args:
      precision: 0
      value: 0
    question: "Nombre d'autres cancers du syndrome de Lynch (l'ovaire, l'estomac, l'intestin grêle, la vésicule biliaire ou les voies biliaires, le pancréas, les voies urinaires (rein-uretère-vessie), la peau («carcinome sébacé » ou « kérato-acanthome ») ou le cerveau) chez vos grands-parents, oncles et tantes, neveux et nièces, petits-enfants, demi-frères, demi-sœurs ?"
    valid_if: sdr_other_ls_count >= 0
    invalid_message: Le nombre de cancers ne peut pas être négatif.
